name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run the suite
        run: pytest tests/ -q
      - name: Print the harness report
        run: python -m kavach.report
      - name: Rebuild the reviewer dashboard
        run: |
          python -m kavach.webui
          git diff --exit-code dashboard.html || {
            echo "::error::dashboard.html is stale — run 'python -m kavach.webui'"
            exit 1
          }
